# The macOS build, kept apart from the release workflow so that a runner problem here
# can't fail a release. It runs on every version tag, and by hand from the Actions tab
# ("Run workflow") to retry. It uploads the archive as a workflow artifact; it doesn't
# attach it to the GitHub release.
name: macOS build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ID: iarliveaudio
      OPUS_STATIC: "1"
      OPUS_NO_PKG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with: { key: universal-apple-darwin }

      - name: Build both Apple architectures and join them
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output "$ID" "target/aarch64-apple-darwin/release/$ID" "target/x86_64-apple-darwin/release/$ID"

      - name: It runs, and says who it is
        run: |
          ./"$ID" --describe > manifest.json
          python3 .github/check_manifest.py manifest.json --release

      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="$ID-$VERSION-universal-apple-darwin"
          mkdir -p "pkg/$name" dist
          cp "$ID" README.md LICENSE "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal-apple-darwin
          path: dist/*
